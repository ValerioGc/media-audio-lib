[package]
name = "media-audio-lib"
version = "0.1.0"
description = "Gestore di libreria audio con editing dei metadati e player integrato."
authors = ["media-audio-lib"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Must differ from the binary name: on Windows the two targets cannot share it.
name = "media_audio_lib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-store = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
