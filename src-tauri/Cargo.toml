[package]
name = "media-audio-lib"
version = "0.1.0"
description = "Audio library manager with metadata editing and an integrated player."
authors = ["media-audio-lib"]
edition = "2021"
rust-version = "1.85"

[lib]
# Must differ from the binary name: on Windows the two targets cannot share it.
name = "media_audio_lib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-store = "2"
lofty = "0.25"
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-autostart = "2.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
