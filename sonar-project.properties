sonar.projectKey=tune-lib
sonar.projectName=TuneLib
sonar.projectVersion=1.0.0

# Analyzed sources. The frontend tests live under tests/, not next to the source, so the
# whole folder is the test code: helpers included, they are test code too.
sonar.sources=src,src-tauri/src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src-tauri/target/**,src-tauri/gen/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.spec.ts,**/*.d.ts,src-tauri/src/main.rs,src-tauri/src/lib.rs

# Rust: report produced by `cargo llvm-cov --lcov`
sonar.rust.lcov.reportPaths=src-tauri/coverage/lcov.info
sonar.rust.clippy.reportPaths=src-tauri/clippy-report.json
